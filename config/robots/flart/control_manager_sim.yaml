# This file is passed to Gazebo Sim, to start a control manager, when working in simulation.
# We also insert in this file, the configuration for the gz_ros_control plugin.

/**/controller_manager:
  ros__parameters:
    use_sim_time: true
    # If in simulation, this frequency should match the one specified in the world.
    update_rate: 250 # Hz.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fork_controller:
      type: position_controllers/JointGroupPositionController

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    # No joints_limits defined here.
    # Limits are defined in the associated xacro file.
