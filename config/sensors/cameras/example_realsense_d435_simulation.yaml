# This file is a complete simulation example for the split RealSense D435 model: color + infrared pair + depth.
#
# Many of the values in this file can be obtained by running the binary:
# > rs-enumerate-devices <options>
# Find more information about the command and its options at
# https://github.com/realsenseai/librealsense/blob/master/tools/enumerate-devices/readme.md

# This flag applies to all simulated sensors in this split D435 model.
use_gravity: True

color_camera:
  enabled: True
  always_on: True
  visualize: False
  enable_metrics: False
  save:
    enabled: False
    path: /tmp
  triggered: False
  visible_mask: 4294967295
  # Clip refers to the near and far clipping planes Gazebo uses when rendering the camera image.
  # Objects closer than near or farther than far are not rendered (captured by Gazebo in the image).
  # It is not related to the RealSense depth camera clipping planes.
  clip:
    near: 0.1
    far: 100.0
  # Official supported modes for the color camera:
  # | Resolution     | Aspect Ratio | FPS allowed | horizontal_fov_deg | vertical_fov_deg |
  # | -------------- | ------------ | ----------- | ------------------ | ---------------- |
  # | 1920×1080      | 16:9         | 30          | 69                 | 42               |
  # | 1280×720       | 16:9         | 30          | 69                 | 42               |
  # | 960×540        | 16:9         | 60          | 69                 | 42               |
  # | 848×480        | 16:9         | 30, 60      | 69                 | 42               |
  # | 640×480        | 4:3          | 30, 60      | 60                 | 45               |
  # | 640×360        | 16:9         | 30, 60      | 69                 | 42               |
  # | 424×240        | 16:9         | 60          | 69                 | 42               |
  # | 320×240        | 4:3          | 30, 60      | 60                 | 45               |
  # | 320×180        | 16:9         | 60          | 69                 | 42               |
  # The RGB camera’s horizontal and vertical FOV are physically fixed (approximately 69° × 42° for the full 16:9 sensor
  # area). When operating in 4:3 modes, the effective FOV changes only because the firmware applies a central crop of
  # the native sensor, resulting in a reduced effective horizontal FOV and a slightly increased vertical FOV
  # (approximately 60° × 45°).
  update_rate: 30.0
  image:
    width: 1920
    height: 1080
    format: R8G8B8
    anti_aliasing: 4
  lens_single_elements:
    type: gnomonical # DO NOT CHANGE
    scale_to_hfov: True # DO NOT CHANGE
    cutoff_angle_deg: 69.0
    env_texture_size: 256
  # Supported by the macro/plugin pipeline, but left empty in this example because the lens model is gnomonical.
  lens_custom_function: ""
  # fx = (image_width_px/2) / tan(horizontal_fov/2) = (1920/2) / tan(69.0/2) = 960 / tan(34.5) = 1396.8
  # fy = (image_height_px/2) / tan(vertical_fov/2)  = (1080/2) / tan(42.0/2) = 540 / tan(21.0) = 1406.7
  # cx = (image_width_px−1) / 2  = (1920−1) / 2 = 959.5
  # cy = (image_height_px−1) / 2 = (1080−1) / 2 = 539.5
  lens_intrinsics:
    fx: 1396.8
    fy: 1406.7
    cx: 959.5
    cy: 539.5
  lens_xy_skew: 0.0
  # Supported by the macro/plugin pipeline, but left empty in this example because the projection matrix is not
  # overridden.
  lens_projection: ""
  distortion_k_p:
    k1: 0.0
    k2: 0.0
    k3: 0.0
    p1: 0.0
    p2: 0.0
  # center_x_norm = lens_intrinsics.cx + 0.5 / image.width = (959.5 + 0.5) / 1920 = 0.5
  # center_y_norm = lens_intrinsics.cy + 0.5 / image.height = (539.5 + 0.5) / 1080 = 0.5
  # +0.5 is used to convert from pixel index to pixel center.
  distortion_center:
    center_x_norm: 0.5
    center_y_norm: 0.5
  gaussian_noise:
    mean: 0.0
    stddev: 0.0

# In the real camera, the depth image is computed by processing the infrared images captured by the two infrared
# cameras. In this simulation model, the two infrared cameras and the depth camera are represented as separate sensors.
# Consequently, this file includes both the infrared camera configuration and the depth camera configuration.

infrared_camera:
  enabled: True
  always_on: True
  visualize: False
  enable_metrics: False
  save:
    enabled: False
    path: /tmp
  triggered: False
  visible_mask: 4294967295
  clip:
    near: 0.1
    far: 10.0
  # Official supported modes:
  # | Resolution     | Aspect Ratio | FPS allowed (typical) | horizontal_fov_deg | vertical_fov_deg |
  # | -------------- | ------------ | --------------------- | ------------------ | ---------------- |
  # | 1280×720       | 16:9         | 30, 15, 6             | 91.2               | 65.5             |
  # | 848×480        | 16:9         | 90, 60, 30            | 91.2               | 65.5             |
  # | 640×480        | 4:3          | 90, 60, 30, 15, 6     | 91.2               | 65.5             |
  # | 640×360        | 16:9         | 90, 60, 30, 15, 6     | 91.2               | 65.5             |
  # | 480×270        | 16:9         | 90, 60, 30            | 91.2               | 65.5             |
  # | 424×240        | 16:9         | 90, 60, 30            | 91.2               | 65.5             |
  update_rate: 30.0
  image:
    width: 1280
    height: 720
    format: L8
    anti_aliasing: 4
  lens_single_elements:
    type: gnomonical # DO NOT CHANGE
    scale_to_hfov: True # DO NOT CHANGE
    cutoff_angle_deg: 91.2
    env_texture_size: 256
  # Supported by the macro/plugin pipeline, but left empty in this example because the lens model is gnomonical.
  lens_custom_function: ""
  # fx = (image_width_px/2) / tan(horizontal_fov/2) = (1280/2) / tan(91.2/2) = 640/tan(45.6) = 626.7
  # fy = (image_height_px/2) / tan(vertical_fov/2) = (720/2) / tan(65.5/2) = 360/tan(32.75) = 559.7
  # cx = (image_width_px − 1) / 2 = (1280 − 1) / 2 = 639.5
  # cy = (image_height_px − 1) / 2 = (720 − 1) / 2 = 359.5
  lens_intrinsics:
    fx: 626.7
    fy: 559.7
    cx: 639.5
    cy: 359.5
  lens_xy_skew: 0.0
  # Supported by the macro/plugin pipeline, but left empty in this example because the projection matrix is not
  # overridden.
  lens_projection: ""
  distortion_k_p:
    k1: 0.0
    k2: 0.0
    k3: 0.0
    p1: 0.0
    p2: 0.0
  # center_x_norm = lens_intrinsics.cx + 0.5 / image.width = (639.5 + 0.5) / 1280 = 0.5
  # center_y_norm = lens_intrinsics.cy + 0.5 / image.height = (359.5 + 0.5) / 720 = 0.5
  # +0.5 is used to convert from pixel index to pixel center.
  distortion_center:
    center_x_norm: 0.5
    center_y_norm: 0.5
  gaussian_noise:
    mean: 0.0
    stddev: 0.0

# Since the real RealSense D435 does not contain an independent depth sensor, but computes depth from the stereo
# infrared pair, it is reasonable in this simulation model to keep the following depth-camera elements consistent with
# infrared-camera ones:
# clip element: to have matching near and far clipping planes.
# update_rate element: to have matching frame rates between depth and infrared images.
# image element: to have matching resolution between depth and infrared images.
# distortion_k_p element: to have matching distortion characteristics.
# distortion_center element: to have matching distortion center between depth and infrared images.
depth_camera:
  enabled: True
  always_on: True
  visualize: False
  enable_metrics: False
  save:
    enabled: False
    path: /tmp
  triggered: False
  visible_mask: 4294967295
  clip:
    near: 0.1
    far: 10.0
  depth_clip:
    near: 0.1
    far: 10.0
  # Depth FOV is the common overlap of the IR imagers: approx. 90° x 63°.
  # | Resolution     | Aspect Ratio | FPS allowed (typical) | horizontal_fov_deg | vertical_fov_deg |
  # | -------------- | ------------ | --------------------- | ------------------ | ---------------- |
  # | 1280×720       | 16:9         | 30, 15, 6             | 90                 | 63               |
  # | 848×480        | 16:9         | 90, 60, 30, 15, 6     | 90                 | 63               |
  # | 640×480        | 4:3          | 90, 60, 30, 15, 6     | 90                 | 63               |
  # | 640×360        | 16:9         | 90, 60, 30, 15, 6     | 90                 | 63               |
  # | 480×270        | 16:9         | 90, 60, 30            | 90                 | 63               |
  # | 424×240        | 16:9         | 90, 60, 30            | 90                 | 63               |
  update_rate: 30.0
  image:
    width: 1280
    height: 720
    anti_aliasing: 4
  # No image.format is exposed here. For depth-only cameras, the published depth stream is always float32 and does not
  # depend on <image><format>.
  lens_single_elements:
    type: gnomonical # DO NOT CHANGE
    scale_to_hfov: True # DO NOT CHANGE
    cutoff_angle_deg: 90.0
    env_texture_size: 256
  # Supported by the macro/plugin pipeline, but left empty in this example because the lens model is gnomonical.
  lens_custom_function: ""
  # fx = (image_width_px/2) / tan(horizontal_fov/2) = (1280/2) / tan(90/2) = 640 / tan(45) = 640
  # fy = (image_height_px/2) / tan(vertical_fov/2)  = (720/2) / tan(63/2) = 360 / tan(31.5) = 588.2
  # cx = (image_width_px − 1) / 2 = (1280 − 1) / 2  = 639.5
  # cy = (image_height_px − 1) / 2 = (720 − 1) / 2  = 359.5
  lens_intrinsics:
    fx: 640.0
    fy: 588.2
    cx: 639.5
    cy: 359.5
  lens_xy_skew: 0.0
  # Supported by the macro/plugin pipeline, but left empty in this example because the projection matrix is not
  # overridden.
  lens_projection: ""
  distortion_k_p:
    k1: 0.0
    k2: 0.0
    k3: 0.0
    p1: 0.0
    p2: 0.0
  # center_x_norm = lens_intrinsics.cx + 0.5 / image.width = (639.5 + 0.5) / 1280 = 0.5
  # center_y_norm = lens_intrinsics.cy + 0.5 / image.height = (359.5 + 0.5) / 720 = 0.5
  # +0.5 is used to convert from pixel index to pixel center.
  distortion_center:
    center_x_norm: 0.5
    center_y_norm: 0.5
  gaussian_noise:
    mean: 0.0
    stddev: 0.0
