################################################################################
# Orbbec Gemini 335Le RGB-D simulation example.
################################################################################

# This variant uses one Gazebo rgbd_camera plugin for color, depth, point cloud, and
# camera_info. It uses the depth FOV because the plugin has one shared lens model.
# The two infrared streams and the IMU remain separate simulated sensors.

rgbd:
  enabled: true
  use_gravity: true
  always_on: true
  visualize: false
  enable_metrics: false
  save: {enabled: false, path: /tmp/orbbec_gemini335le_rgbd}
  triggered: false
  visible_mask: 4294967295
  update_rate: 30.0
  image: {width: 1280, height: 800, format: R8G8B8, anti_aliasing: 4}
  lens_single_elements:
    type: gnomonical
    scale_to_hfov: true
    cutoff_angle_deg: 90.0
    env_texture_size: 256
  lens_custom_function: ""
  lens_intrinsics:
    fx: 640.0
    fy: 627.8
    cx: 639.5
    cy: 399.5
  lens_xy_skew: 0.0
  lens_projection: ""
  distortion_k_p: {k1: 0.0, k2: 0.0, k3: 0.0, p1: 0.0, p2: 0.0}
  distortion_center: {center_x_norm: 0.5, center_y_norm: 0.5}
  gaussian_noise: {mean: 0.0, stddev: 0.0}
  clip: {near: 0.1, far: 20.0}
  depth_clip: {near: 0.25, far: 20.0}
  base_topic: orbbec_gemini335le/rgbd
  trigger_topic: ""

