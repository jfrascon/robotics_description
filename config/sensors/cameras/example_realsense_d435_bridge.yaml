# Example bridge channels for the split RealSense D435 model: color + infrared pair + depth.

realsense_d435_color_image:
  ros_topic_name: realsense_d435/color/image_raw
  gz_topic_name: realsense_d435/color/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: True

realsense_d435_color_camera_info:
  ros_topic_name: realsense_d435/color/camera_info
  gz_topic_name: realsense_d435/color/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: True

realsense_d435_color_trigger:
  ros_topic_name: realsense_d435/color/trigger
  gz_topic_name: realsense_d435/color/trigger
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ
  qos_profile: DEFAULT
  lazy: True

