enabled: True
use_gravity: True
always_on: True
visualize: False
update_rate: 10.0
# The guide gives horizontal FOV 120 deg, from -60 deg to +60 deg.
hor_fov_deg: { "min_angle": -60.0, "max_angle": 60.0 }
# The guide says angular resolution is not uniform and gives 0.2 deg average.
hor_res_deg: 0.2
# The guide gives vertical FOV 25 deg, from -12.5 deg to +12.5 deg.
ver_fov_deg: { "min_angle": -12.5, "max_angle": 12.5 }
# The guide says angular resolution is not uniform and gives 0.2 deg average.
ver_res_deg: 0.2
# The guide gives ranging distance 0.5 m to 200 m.
dist_span: { "min_dist": 0.5, "max_dist": 200.0 } # m
# The guide states that radial distance resolution is 5 mm.
dist_res: 0.005
# The guide does not provide a simulation noise model.
gaussian_noise: { "mean": 0.0, "stddev": 0.0 }
# The Gazebo plugin will publish two topics:
# Topic <base_topic> with messages of type gz.msgs.LaserScan.
# Topic <base_topic>/points with messages of type gz.msgs.PointCloudPacked.
base_topic: robosense_m1_plus/scan
